services:
  # Database for our Policy Service
  postgres-db:
    image: postgres:16
    container_name: policy-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: policydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - insurance-network

  # Distributed Tracing 
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin-server
    ports:
      - "9411:9411"
    networks:
      - insurance-network
    # Metrics Visualization
    #grafana:
    #image: grafana/grafana:latest
    #container_name: grafana-dashboard
    #ports:
    #  - "3000:3000"
    #environment:
    # - GF_SECURITY_ADMIN_PASSWORD=admin
    #networks:
    # - insurance-network

    # Database for our Claims Service
  mongodb:
    image: mongo:latest
    container_name: claims-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - insurance-network

volumes:
  postgres_data:
  mongodb_data:


networks:
  insurance-network:
    driver: bridge
